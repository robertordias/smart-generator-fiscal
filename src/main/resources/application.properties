spring.config.import=optional:file:./.env[.properties]
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:${DB_PORT:5432}/${DB_NAME:fiscal}}
spring.datasource.username=${DB_USER:fiscal}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=never
spring.flyway.locations=classpath:db/migration/{vendor},classpath:db/common
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-version=0
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=10000
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
